[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signature-cot"
version = "0.1.0"
description = "Reproducible signature-backed CoT extraction for QA and agentic tool use"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
signature-cot = "signature_cot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["signature_cot*"]

