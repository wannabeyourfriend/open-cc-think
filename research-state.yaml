      conversational_qa_signed_decisions: 2
      math_signed_decisions: 1
      math_task_success: true
      agentic_coding_signed_decisions: 2
      agentic_coding_task_success: true
      harness_note: "apply_patch is the terminal prediction; deterministic verification runs outside the model loop."
  trajectory:
    - run_id: "H1a-run-001"
      hypothesis: "H1a"
      metric_name: "synthetic_control_false_positive_rate"
      metric_value: 0.0
