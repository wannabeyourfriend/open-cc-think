project:
  title: "Evidence-Graded Signature-Backed CoT Recovery"
  question: "When does signed-state replay yield a boundary-complete, summary-distinct, stable, useful recovery candidate, and which extraction prompts maximize that evidence across scenarios?"
  status: active
  started: "2026-07-17"
  domain: "chain-of-thought monitorability and agent-trace evaluation"
  claim_ceiling: "signature-backed full-span recovery candidate; not ground-truth CoT"

literature:
  key_papers:
    - id: "aws-converse-reasoning"
      title: "Inference using the Converse API"
      authors: "Amazon Web Services"
      year: 2026
      relevance: "Defines reasoningContent signatures and unchanged-prefix continuity."
    - id: "anthropic-extended-thinking"
      title: "Extended thinking"
      authors: "Anthropic"
      year: 2026
      relevance: "Distinguishes billed full-thinking tokens from visible summaries and documents display/signature behavior."
    - id: "lanham2023faithfulness"
      title: "Measuring Faithfulness in Chain-of-Thought Reasoning"
      authors: "Lanham et al."
      year: 2023
      relevance: "Motivates defense-in-depth interventions instead of a single faithfulness proxy."
    - id: "turpin2023unfaithful"
      title: "Language Models Don't Always Say What They Think"
      authors: "Turpin et al."
      year: 2023
      relevance: "Shows plausible CoT can rationalize hidden causal influences."
    - id: "korbak2025monitorability"
      title: "Chain of Thought Monitorability: A New and Fragile Opportunity for AI Safety"
      authors: "Korbak et al."
      year: 2025
      relevance: "Frames monitorability as useful but fragile and imperfect."
    - id: "emmons2025pragmatic"
      title: "A Pragmatic Way to Measure Chain-of-Thought Monitorability"
      authors: "Emmons et al."
      year: 2025
      relevance: "Provides coverage and legibility proxies with explicit limitations."
  open_problems:
    - "No independent plaintext channel exists for validating complete Claude internal working."
    - "Boundary canaries are near-saturated and do not distinguish original text from reconstruction."
    - "Raw length and LLM judges can reward verbosity rather than provenance or completeness."
    - "Prompt search and held-out agent-trace evaluation are not yet cleanly separated."
  evidence_gaps:
    - "No planted multi-anchor fidelity suite beyond two boundary markers."
    - "No frozen false-positive control set for metric calibration."
    - "No replay-replicate stability measurement on the same signature."
    - "No balanced agentic batch stratified by signed decision type."
    - "No task-clustered confidence intervals or cross-model replication."

hypotheses:
  - id: H1
    statement: "A hard-gated evidence vector combining anchor fidelity, token-length alignment, copy resistance, controls, stability, and functional coverage will reject summary expansion and fresh reconstruction more reliably than the current canary-plus-overlap metric."
    status: active
    motivation: "The current checked-in audit is 0/14 strong, while one new live run is strong; a falsifiable metric must explain the difference without rewarding verbosity."
    parent: null
    priority: high
  - id: H2
    statement: "Paired scenario-macro successive halving over retrieval-oriented prompts will improve held-out strong-recovery rate without increasing control false positives."
    status: pending
    motivation: "Prompt wording changes recovery behavior, but one-off best scores are selection-biased."
    parent: null
    priority: high
  - id: H1a
    statement: "Deterministic full-length alignment, summary n-gram containment, and ordered content-anchor fidelity separate a known complete trace from frozen padding, truncation, corruption, reordering, and fresh-solution controls."
    status: supported
    motivation: "This is the first falsification layer needed before live metric calibration."
    parent: H1
    priority: high
  - id: H1b
    statement: "Repeated blind replay across complex conversational QA, math reasoning, and agentic coding yields a useful balanced corpus whose recovery-evidence distributions can be measured with exact task and decision denominators."
    status: refuted
    motivation: "The project needs substantially more scenario-diverse evidence before changing prompts or production gates."
    result: "Collection succeeded (135/135 instances, 45/45 tasks, 226 decisions with exact denominators) but the corpus is not useful: the boundary canary is satisfiable by echo because the extraction prompt names it, the scenarios that clear the gate bill too few thinking tokens to carry a full-span claim, and the scenario with substantial thinking loses 54% of decisions to canary leakage. The measured 47.4% v0 strong rate is an instrument artifact."
    parent: H1
    priority: high
  - id: H1c
    statement: "Hidden content anchors that the extraction prompt never names, planted in steps selected for substantial observed billed thinking, separate signature-backed state recovery from re-derivation and summary expansion."
    status: pending
    motivation: "H1b showed the boundary canary measures harvest instruction-following, not replay provenance, and that low-thinking steps make the full-length ratio vacuous. Both must be fixed before any recovery rate is meaningful."
    parent: H1
    priority: high
  - id: H3
    statement: "Recovery evidence varies systematically by signed decision type, with tool arguments and observation integration harder than compact final answers."
    status: pending
    motivation: "Pooling decisions hides the exact agent behaviors needed for useful trajectories."
    parent: null
    priority: high
  - id: H4
    statement: "Successful blind replays of one signature reproduce distinctive details absent from the provider summary more consistently than unsigned and summary-only controls."
    status: pending
    motivation: "Repeatability of new details is supporting evidence against unconstrained reconstruction."
    parent: H1
    priority: medium
  - id: H5
    statement: "Provider-side omitted-summary harvests and locally blinded summarized harvests have comparable recovery evidence distributions after controlling for task and effort."
    status: pending
    motivation: "The provider documents identical signature behavior across display modes, but population-level recovery equivalence is untested."
    parent: H1
    priority: medium

