outer_loop:
  cycle: 1
  last_direction: "DEEPEN H1 via H1c: hidden content anchors the extraction prompt never names, on steps selected for substantial observed billed thinking."
  last_reflection: "H1b delivered its corpus and refuted its own usefulness. Three defects are design errors rather than bad luck: the boundary canary is named in the extraction prompt, so it can only measure harvest instruction-following; task difficulty was chosen by dataset label, so the scenarios that pass the gate bill 67-151 thinking tokens and their recoveries are re-derivations; and the one scenario with real thinking puts the harvest instruction in competition with a prose deliverable, leaking the canary on 54% of decisions. The v0 gate's 47.4% strong rate reproduces exactly the fresh-reconstruction false positive H1a predicted. Adding scenarios or optimizing prompts against this instrument would compound the error, so H2 stays blocked until anchors and a thinking-token floor exist."

